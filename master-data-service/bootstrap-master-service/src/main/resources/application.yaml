spring:
  application:
    name: stewardmesh-master-service
  datasource:
    url: ${STEWARDMESH_DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stewardmesh}}
    username: ${POSTGRES_USER:stewardmesh}
    password: ${POSTGRES_PASSWORD:stewardmesh-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${STEWARDMESH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

springdoc:
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash

stewardmesh:
  intake-storage:
    bucket: ${STEWARDMESH_INTAKE_BUCKET:stewardmesh-intake}
    endpoint: ${STEWARDMESH_S3_ENDPOINT:http://localhost:${LOCALSTACK_PORT:4566}}
    force-path-style: ${STEWARDMESH_S3_FORCE_PATH_STYLE:true}
    region: ${AWS_REGION:eu-central-1}

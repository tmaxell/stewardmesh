name: stewardmesh

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-stewardmesh-local}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/stewardmesh-realm.json:/opt/keycloak/data/import/stewardmesh-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stewardmesh}
      POSTGRES_USER: ${POSTGRES_USER:-stewardmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stewardmesh-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stewardmesh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      STEWARDMESH_INTAKE_BUCKET: ${STEWARDMESH_INTAKE_BUCKET:-stewardmesh-intake}
      STEWARDMESH_MASTER_EVENTS_QUEUE: ${STEWARDMESH_MASTER_EVENTS_QUEUE:-stewardmesh-master-events}
      STEWARDMESH_SOURCE_EVENTS_QUEUE: ${STEWARDMESH_SOURCE_EVENTS_QUEUE:-stewardmesh-source-events}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - stewardmesh-localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api list-buckets >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  stewardmesh-postgres:
  stewardmesh-localstack:
